[tools]
bun = "latest"
uv = "latest"
duckdb = "latest"
oxfmt = "latest"

[tasks.fmt]
description = "Format GDScript (gdformat) and Markdown (oxfmt) files"
run = ['uvx --from "gdtoolkit==4.*" gdformat .', 'oxfmt "**/*.md"']

[tasks.build-web]
description = "Build web app and bundle assets into Godot addon"
run = "cd web && bun run build:addon"

[tasks.test]
description = "Run headless Godot test suite"
run = "godot --headless --path godot_project -s res://test_importer_headless.gd && godot --headless --path godot_project -s res://test_player_character.gd"

[tasks.test-character]
description = "Run 3D player character verification tests"
run = "godot --headless --path godot_project -s res://test_player_character.gd"
[tasks.test-web]
description = "Run web unit tests"
run = "cd web && bun test"

# Helper function
[tasks.geojson]
description = "Convert OSM export JSON to GeoJSON in data/ directory"
raw = true
run = "./scripts/convert-geojson.sh"

[tasks.fetch-overture]
description = "[LEGACY] Fetch Overture Maps buildings, roads, and POIs as GeoJSON for a bounding box"
run = "python3 scripts/fetch_overture.py"
[tasks.clear-scene]
alias = ["clear-city-viewer"]
description = "Clear existing city_viewer scene to an empty base scene"
run = "godot --headless --path godot_project -s res://addons/osm_importer/clear_scene.gd"

[tasks.dev]
description = "Clear existing city_viewer scene and open Godot editor"
depends = ["clear-scene"]
run = "godot --editor --path godot_project"
